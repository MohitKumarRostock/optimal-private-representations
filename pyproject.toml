[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optimal-private-representations"
version = "0.1.0"
description = "Reproducible finite-law studies and reference algorithms for private task learning"
requires-python = ">=3.12"
dependencies = [
  "numpy==2.3.5",
  "scipy==1.17.0",
  "matplotlib==3.10.8",
]

[project.scripts]
opr = "optimal_private_representations.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

