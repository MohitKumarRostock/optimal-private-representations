name: Research reference checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install recorded numerical dependencies and package
        run: python -m pip install -e .
      - name: Unit and recorded-replay checks
        run: python -m unittest discover -s tests -v
      - name: Smoke workflow
        run: opr smoke --output-dir outputs/ci-smoke
      - name: Frozen-reference verification and finite checks
        run: opr validate --reference-dir data/reference --output-dir outputs/ci-validation

